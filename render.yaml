services:
  - type: web
    name: memeos
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Genau EIN Gunicorn-Prozess: Render-Queue-Worker und Scheduler dürfen nur einmal laufen
    # (--threads hält die App reaktionsfähig, während Jobs/Renders laufen).
    # --bind ist PFLICHT: ohne ihn lauscht gunicorn auf 127.0.0.1:8000, Render erwartet aber
    # 0.0.0.0 auf dem Port aus $PORT. Der Deploy scheiterte sonst mit "no open ports detected",
    # obwohl der Prozess läuft. Das Procfile hatte es richtig, aber startCommand sticht es.
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 180 --bind 0.0.0.0:$PORT
    # Render prüft hier, ob der Dienst lebt. Nicht "/" nehmen: das ist hinter dem Login
    # und antwortet mit 302 auf /login – Render erwartet eine 200. /ping ist offen und
    # antwortet ohne Datenbankzugriff.
    healthCheckPath: /ping
    envVars:
      # Render liest .python-version (runtime.txt ist Heroku-Konvention und wird ignoriert);
      # PYTHON_VERSION ist die zweite Sicherung. Ohne beides baut Render mit der neuesten
      # Python-Version, für die es kein Pillow-Wheel gibt.
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CANVA_CLIENT_ID
        sync: false
      - key: CANVA_CLIENT_SECRET
        sync: false
      - key: CANVA_REFRESH_TOKEN
        sync: false
      - key: CONTENT_OS_URL
        sync: false
      - key: CONTENT_OS_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      # Uploads/Renders/Exports/Fonts liegen auf der gemounteten Disk (überleben Deploys)
      - key: MEMEOS_DATA_ROOT
        value: /opt/render/project/src/instance
      # Render-Queue: Anzahl Worker-Threads im Prozess (0 = aus, dann POST /api/render/run-once)
      - key: MEMEOS_WORKERS
        value: "3"
      # Automatik-Thread (RSS/Events/Wetter/Digest/Telegram-Poll); 0 = aus
      - key: MEMEOS_SCHEDULER
        value: "1"
      # RapidAPI (Inspiration-Abholung von Instagram); alternativ im Dashboard unter Einstellungen → Integrationen
      - key: RAPIDAPI_KEY
        sync: false
      # DeepSeek als Ausweichmodell, falls Anthropic klemmt oder zu teuer wird.
      # ACHTUNG: deepseek-v4-flash ist ein Reasoning-Modell – zu kleines max_tokens liefert
      # eine LEERE Antwort ohne Fehler.
      - key: DEEPSEEK_API_KEY
        sync: false
      # Modell für die Bildanalyse (Vorgabe im Code); hier überschreibbar, ohne neu zu bauen.
      - key: MEMEOS_VISION_MODEL
        sync: false
      # Umrechnung der Anthropic-Preise (die Rechnung kommt in Dollar) in die Währung, in
      # der die Kostenbremsen zählen. 1.00 heisst: nicht umrechnen – die Grenze "10 €" ist
      # dann in Wahrheit 10 $ und greift damit früher, nicht später. Wer den Tageskurs
      # eintragen will (z. B. 0.92), tut das hier.
      - key: MEMEOS_USD_EUR
        value: "1.00"
      # Telegram (Tagesdigest) wird NICHT hier gesetzt, sondern im Dashboard unter
      # Einstellungen → Telegram; die Werte stehen in AppSettings, nicht in der Umgebung.
    disk:
      name: memeos-data
      mountPath: /opt/render/project/src/instance
      # DB + Uploads + Renders + Exporte + Importe liegen alle hier; ein Stapel über 100 Städte
      # mit 5 Slides belegt schon rund 0,66 GB.
      sizeGB: 10
