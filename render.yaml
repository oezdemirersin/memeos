services:
  - type: web
    name: memeos
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Genau EIN Gunicorn-Prozess: Render-Queue-Worker und Scheduler dürfen nur einmal laufen
    # (--threads hält die App reaktionsfähig, während Jobs/Renders laufen)
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 180
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CANVA_CLIENT_ID
        sync: false
      - key: CANVA_CLIENT_SECRET
        sync: false
      - key: CANVA_REFRESH_TOKEN
        sync: false
      - key: CONTENT_OS_URL
        sync: false
      - key: CONTENT_OS_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      # Uploads/Renders/Exports/Fonts liegen auf der gemounteten Disk (überleben Deploys)
      - key: MEMEOS_DATA_ROOT
        value: /opt/render/project/src/instance
      # Render-Queue: Anzahl Worker-Threads im Prozess (0 = aus, dann POST /api/render/run-once)
      - key: MEMEOS_WORKERS
        value: "3"
      # Automatik-Thread (RSS/Events/Wetter/Digest/Telegram-Poll); 0 = aus
      - key: MEMEOS_SCHEDULER
        value: "1"
      # RapidAPI (Inspiration-Abholung von Instagram); alternativ im Dashboard unter Einstellungen → Integrationen
      - key: RAPIDAPI_KEY
        sync: false
    disk:
      name: memeos-data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
